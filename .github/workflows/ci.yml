name: OpenSolve CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Typecheck & Build
      # Mock the env vars needed just for the build to pass (if any are hard-required by Next build logic)
      env:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_mock_key
        CLERK_SECRET_KEY: sk_test_mock_key
        AWS_ACCESS_KEY_ID: mock-key
        AWS_SECRET_ACCESS_KEY: mock-secret
      run: npm run build
